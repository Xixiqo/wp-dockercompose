map $request_method $skip_cache_method {
    default 0;
    POST 1;
}

map $query_string $skip_cache_query {
    default 0;
    ~*(^|&)(preview|customize_changeset_uuid|elementor-preview|nocache|cache-bust)= 1;
}

map $http_cookie $skip_cache_cookie {
    default 0;
    ~*wordpress_logged_in_ 1;
    ~*wp-postpass_ 1;
    ~*comment_author_ 1;
}

map $request_uri $skip_cache_admin {
    default 0;
    ~*^/wp-admin/ 1;
    ~*^/wp-login\.php$ 1;
}

map "$skip_cache_method$skip_cache_cookie$skip_cache_admin$skip_cache_query" $skip_cache {
    default 0;
    ~1 1;
}

# Cache cepat untuk halaman publik WordPress.
fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=WORDPRESS:100m inactive=60m max_size=256m use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 32m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

