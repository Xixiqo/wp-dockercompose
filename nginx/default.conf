fastcgi_cache_path /var/cache/nginx levels=1:2
keys_zone=WORDPRESS:50m
inactive=60m
use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";


server {

    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;
    client_max_body_size 64M;

    # ==========================
    # Cache Control Variable
    # ==========================
    set $skip_cache 0;

    # Jangan cache POST request
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # Jangan cache query parameter
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # Jangan cache halaman WordPress tertentu
    if ($request_uri ~* "/wp-admin/|/wp-login.php|/wp-cron.php|/wp-comments-post.php") {
        set $skip_cache 1;
    }

    # Jangan cache user login
    if ($http_cookie ~* "wordpress_logged_in|comment_author") {
        set $skip_cache 1;
    }

    # ==========================
    # Main WordPress Routing
    # ==========================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ==========================
    # PHP-FPM Processing
    # ==========================
    location ~ \.php$ {

        try_files $fastcgi_script_name =404;
        include fastcgi_params;

        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME
        $document_root$fastcgi_script_name;

        fastcgi_param SCRIPT_NAME
        $fastcgi_script_name;

        fastcgi_param PATH_INFO
        $fastcgi_path_info;

        # ==========================
        # FastCGI Optimization
        # ==========================
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # ==========================
        # FastCGI Cache
        # ==========================
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_valid 301 302 1h;

        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;

        fastcgi_cache_use_stale
        error timeout invalid_header updating http_500 http_503;

        fastcgi_cache_background_update on;

        fastcgi_cache_lock on;

        # Header untuk monitoring cache hit/miss
        add_header X-FastCGI-Cache $upstream_cache_status always;

    }

    # ==========================
    # Static Files Cache
    # ==========================
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ==========================
    # Block Hidden Files
    # ==========================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================
    # Block Sensitive WordPress Files
    # ==========================
    location ~* /(wp-config.php|readme.html|license.txt) {
        deny all;
    }

    # ==========================
    # Compression
    # ==========================
    gzip on;
    gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;
}