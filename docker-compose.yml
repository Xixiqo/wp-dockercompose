services:
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - wordpress_data:/var/www/html:ro
    networks:
      - frontend
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    container_name: wp_web
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', '${WP_REDIS_HOST:-redis}');
        define('WP_REDIS_PORT', ${WP_REDIS_PORT:-6379});
        define('WP_CACHE_KEY_SALT', '${WP_CACHE_KEY_SALT:-change-me-to-a-random-string}');
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend
      - backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:11
    container_name: wp_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: wp_redis
    networks:
      - backend
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory-policy allkeys-lru --maxmemory 128mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  wordpress_data: